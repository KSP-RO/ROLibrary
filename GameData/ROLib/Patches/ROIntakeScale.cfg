// Adds independent width/height/length scaling (ModuleROIntakeScale) to every intake part -- the stock
// intakes and any modded ones -- so a single fixed-mesh intake covers a range of sizes. Excludes engine
// parts (built-in intakes like the Goliath), cockpits, procedural parts, parts another module already
// scales (TweakScale), and intakes that carry tanks or fuel (their volume would not follow the scale).
//
// lengthAxis (x|y|z) tells the module which model-local axis is the airflow/length direction; the other
// two are width & height (frontal capture area). Meshes vary in orientation, so the outliers are tuned
// per-part below; the default assumes the model's length runs along its local Y (stack) axis.
// Slider limits are minScale / maxScale (default 0.25 - 6).
//
// Both run in :LAST[ROLib], after every mod's FOR pass: RealismOverhaul turns some mods' intakes into
// AJEInlet only in its own FOR pass, after AJE's.

// --- AJE: intakes renamed to AJEInlet ---
@PART[*]:HAS[@MODULE[AJEInlet],!MODULE[ModuleROIntakeScale],!MODULE[ModuleEngines*],!MODULE[ModuleCommand],!MODULE[ProceduralPart],!MODULE[TweakScale],!MODULE[ModuleFuelTanks],!RESOURCE[LiquidFuel],!RESOURCE[Oxidizer],!RESOURCE[MonoPropellant]]:LAST[ROLib]
{
	MODULE
	{
		name = ModuleROIntakeScale
		lengthAxis = y
	}
}

// --- plain ModuleResourceIntake (no AJE, or an intake AJE left alone) ---
@PART[*]:HAS[@MODULE[ModuleResourceIntake],!MODULE[AJEInlet],!MODULE[ModuleROIntakeScale],!MODULE[ModuleEngines*],!MODULE[ModuleCommand],!MODULE[ProceduralPart],!MODULE[TweakScale],!MODULE[ModuleFuelTanks],!RESOURCE[LiquidFuel],!RESOURCE[Oxidizer],!RESOURCE[MonoPropellant]]:LAST[ROLib]
{
	MODULE
	{
		name = ModuleROIntakeScale
		lengthAxis = y
	}
}

// --- per-part orientation overrides (tuned in-game where the default y-axis length is wrong) ---
// NOTE: these match the PART *name*, not the cfg filename. The XM-G50's part name is "airScoop".
// Both radial intakes mount on their side, so their airflow/length axis is local Z (not the default Y).
// Run in :FINAL so the HAS[@MODULE[ModuleROIntakeScale]] guard is guaranteed to see the module.
@PART[airScoop]:HAS[@MODULE[ModuleROIntakeScale]]:FINAL         { @MODULE[ModuleROIntakeScale] { @lengthAxis = z } }
@PART[IntakeRadialLong]:HAS[@MODULE[ModuleROIntakeScale]]:FINAL  { @MODULE[ModuleROIntakeScale] { @lengthAxis = z } }
